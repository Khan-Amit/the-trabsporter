name: Sluice Bench 3-Day Validation

on:
  schedule:
    # Runs at minute 5 past every hour (every hour, 72 times over 3 days)
    - cron: '5 * * * *'
  workflow_dispatch:  # Allows you to start it manually right now

jobs:
  validate-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sluice-bench (Your C Filter)
        run: gcc sluice-bench-1.c -o sluice1

      - name: Run 3-Minute Filter Test
        run: |
          # Generate continuous random data for 3 minutes
          timeout 180 cat /dev/urandom | ./sluice1 > filtered.txt
          
          TOTAL=$(stat -c%s filtered.txt 2>/dev/null || echo 0)
          REJECTED=$(echo "scale=0; 10485760 - $TOTAL" | bc)
          RATE=$(echo "scale=2; ($REJECTED / 10485760) * 100" | bc)
          
          echo "### 🛡️ Sluice Gate Validation Run" >> $GITHUB_STEP_SUMMARY
          echo "- **Filtered Bytes (Accepted):** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejection Rate:** $RATE%" >> $GITHUB_STEP_SUMMARY
          
          echo "REJECTION_RATE=$RATE" >> $GITHUB_OUTPUT

      - name: Check Result (Fail if below 95%)
        run: |
          if (( $(echo "${{ steps.run.outputs.REJECTION_RATE }} < 95" | bc -l) )); then
            echo "❌ Rejection rate ${{ steps.run.outputs.REJECTION_RATE }}% is below 95% threshold"
            exit 1
          else
            echo "✅ Validation passed: ${{ steps.run.outputs.REJECTION_RATE }}% rejection rate"
          fi
