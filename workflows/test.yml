name: Sluice Bench 3-Day Validation

on:
  schedule:
    # Runs every hour at 5 minutes past the hour
    - cron: '5 * * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  validate-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bc (calculator)
        run: sudo apt-get install -y bc

      - name: Compile sluice-bench
        run: gcc sluice-bench-1.c -o sluice1

      - name: Run 3-Minute Filter Test
        run: |
          echo "Starting filter test on 10MB of /dev/urandom..."
          timeout 180 cat /dev/urandom | head -c 10485760 | ./sluice1 > filtered.txt
          
          TOTAL=$(stat -c%s filtered.txt 2>/dev/null || echo 0)
          REJECTED=$(echo "scale=0; 10485760 - $TOTAL" | bc)
          RATE=$(echo "scale=2; ($REJECTED / 10485760) * 100" | bc)
          
          echo "========================================="
          echo "Sluice Gate Validation Result"
          echo "========================================="
          echo "Total bytes processed: 10485760"
          echo "Accepted bytes: $TOTAL"
          echo "Rejected bytes: $REJECTED"
          echo "Rejection rate: $RATE%"
          echo "========================================="
          
          # Save to GitHub summary
          echo "### 🛡️ Sluice Gate Validation" >> $GITHUB_STEP_SUMMARY
          echo "- **Total bytes:** 10485760" >> $GITHUB_STEP_SUMMARY
          echo "- **Accepted bytes:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejection rate:** $RATE%" >> $GITHUB_STEP_SUMMARY
          
          # Fail if rejection rate is below 95%
          if (( $(echo "$RATE < 95" | bc -l) )); then
            echo "❌ Rejection rate $RATE% is below 95% threshold"
            exit 1
          else
            echo "✅ Validation passed: $RATE% rejection rate"
          fi

      - name: Upload filtered output (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtered-output
          path: filtered.txt
