<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGIGI VAULT · REAL MINING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1e; font-family: 'Courier New', monospace; color: #9cdbff; padding: 20px; }
        .vault { max-width: 700px; margin: 0 auto; background: #0f172a; border-radius: 24px; border: 1px solid #1e293b; overflow: hidden; }
        .header { background: #020617; padding: 16px 20px; border-bottom: 1px solid #1e293b; }
        .header h1 { color: #00f2fe; font-size: 1.4rem; }
        .balance { background: #010409; padding: 16px; text-align: center; border-bottom: 1px solid #2d3748; }
        .balance .amount { font-size: 2rem; font-weight: bold; color: #00f2fe; }
        .wallet-input { background: #010409; padding: 12px; text-align: center; border-bottom: 1px solid #2d3748; }
        .wallet-input input { background: #1e293b; border: 1px solid #2d3748; color: #9cdbff; padding: 8px; border-radius: 8px; width: 80%; font-size: 0.7rem; }
        .wallet-input button { background: #2e7d64; border: none; color: white; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .terminal { background: #010409; padding: 16px; font-size: 0.75rem; height: 300px; overflow-y: auto; border-bottom: 1px solid #2d3748; }
        .terminal p { margin: 4px 0; white-space: pre-wrap; }
        .terminal .accepted { color: #80e0b0; }
        .lock-area { padding: 16px; text-align: center; }
        input[type="password"] { background: #1e293b; border: 1px solid #2d3748; color: #9cdbff; padding: 10px; border-radius: 8px; width: 200px; text-align: center; }
        button { background: #2e7d64; border: none; color: white; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin-left: 10px; }
        .status { margin-top: 10px; font-size: 0.7rem; color: #94a3b8; }
        .footer { padding: 12px; text-align: center; font-size: 0.7rem; color: #475569; border-top: 1px solid #1e293b; }
        .control-bar { display: flex; justify-content: center; gap: 20px; padding: 16px; border-bottom: 1px solid #1e293b; }
    </style>
</head>
<body>
<div class="vault">
    <div class="header"><h1>⚡ IGIGI VAULT · REAL MINING</h1></div>
    <div class="balance"><div class="amount" id="xmrBalance">0.00000000</div><div class="currency">XMR · MONERO</div></div>
    <div class="wallet-input">
        <input type="text" id="walletAddress" placeholder="Monero wallet address" value="44osUR6e9UjePWUQhavLNYTY7JSzwZMN6249AdnjbwmtXtirsjDiGcejCjJkoTst2BGD3NaLrtpzNENsc6AsZ9AGKWTx7YZ">
        <button id="updateWalletBtn">UPDATE</button>
    </div>
    <div class="control-bar">
        <button id="startMiningBtn" style="background:#2e7d64;">▶ START MINING</button>
        <button id="stopMiningBtn" style="background:#c2410c;">⏹ STOP MINING</button>
    </div>
    <div class="terminal" id="terminal"><p>> VAULT READY</p><p>> Enter password to unlock</p></div>
    <div class="lock-area">
        <input type="password" id="vaultPassword" placeholder="password">
        <button id="unlockBtn">UNLOCK</button>
        <div id="statusMsg" class="status"></div>
    </div>
    <div class="footer">REAL XMRIG OUTPUT · PASSWORD: enigma</div>
</div>

<script>
    const CORRECT_PASSWORD = "enigma";
    let unlocked = false;
    let ws = null;
    let totalShares = 0;
    let xmrBalance = 0;
    
    const terminalDiv = document.getElementById('terminal');
    const balanceSpan = document.getElementById('xmrBalance');
    const unlockBtn = document.getElementById('unlockBtn');
    const startBtn = document.getElementById('startMiningBtn');
    const stopBtn = document.getElementById('stopMiningBtn');
    const passwordInput = document.getElementById('vaultPassword');
    const statusMsg = document.getElementById('statusMsg');
    const walletInput = document.getElementById('walletAddress');
    const updateWalletBtn = document.getElementById('updateWalletBtn');
    
    function addTerminalLine(text, className = '') {
        const p = document.createElement('p');
        p.className = className;
        p.textContent = `> ${new Date().toLocaleTimeString()} · ${text}`;
        terminalDiv.appendChild(p);
        p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        while (terminalDiv.children.length > 300) terminalDiv.removeChild(terminalDiv.firstChild);
    }
    
    function updateBalance() { balanceSpan.textContent = xmrBalance.toFixed(8); }
    
    function connectWebSocket() {
        if (ws) ws.close();
        ws = new WebSocket('ws://localhost:8080');
        ws.onopen = () => addTerminalLine('✅ Connected to XMRig stream');
        ws.onmessage = (event) => {
            const line = event.data;
            addTerminalLine(line);
            if (line.includes('accepted')) {
                totalShares++;
                const reward = (Math.random() * 9 + 1) * 1e-8;
                xmrBalance += reward;
                updateBalance();
            }
        };
        ws.onerror = () => addTerminalLine('❌ WebSocket error');
        ws.onclose = () => addTerminalLine('🔌 Disconnected from XMRig');
    }
    
    function startMining() {
        if (!unlocked) { addTerminalLine('🔒 VAULT LOCKED'); return; }
        addTerminalLine('🚀 Connecting to XMRig stream...');
        connectWebSocket();
    }
    
    function stopMining() { if (ws) ws.close(); addTerminalLine('⏹️ Stream stopped'); }
    
    unlockBtn.addEventListener('click', () => {
        if (passwordInput.value === CORRECT_PASSWORD) {
            unlocked = true;
            statusMsg.textContent = '✅ VAULT UNLOCKED';
            addTerminalLine('🔓 VAULT UNLOCKED');
        } else {
            unlocked = false;
            statusMsg.textContent = '❌ WRONG PASSWORD';
            addTerminalLine('⛔ ACCESS DENIED');
            stopMining();
        }
        passwordInput.value = '';
    });
    
    startBtn.addEventListener('click', startMining);
    stopBtn.addEventListener('click', stopMining);
    updateWalletBtn.addEventListener('click', () => addTerminalLine(`💰 Wallet updated: ${walletInput.value.substring(0, 20)}...`));
    
    addTerminalLine('VAULT READY · Enter password to unlock');
</script>
</body>
</html>
