<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Igigi Vault · Treasure Chest Wallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vault-container {
            max-width: 1300px;
            width: 100%;
            background: #0f1322;
            border-radius: 2rem;
            border: 1px solid #ffaa33;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .header {
            background: #080c18;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #ffaa33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffcc66;
        }
        .status-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 6px #ff4444;
        }
        .status-led.unlocked { background: #44ff44; box-shadow: 0 0 6px #44ff44; }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 0;
            min-height: 500px;
        }
        .vault-panel {
            background: #0c1020;
            padding: 1.5rem;
            border-right: 1px solid #2a3a60;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .chest-area {
            text-align: center;
            background: #080c1a;
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 2px solid #ffaa33;
        }
        .chest-icon {
            font-size: 4rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .vault-count {
            font-size: 2rem;
            font-weight: bold;
            color: #ffcc66;
        }
        .btc-balance {
            font-size: 1.2rem;
            color: #88ff88;
            margin-top: 5px;
        }
        .password-area {
            background: #080c1a;
            border-radius: 1.5rem;
            padding: 1rem;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        input {
            background: #010410;
            border: 1px solid #2a3a60;
            color: #bbd4ff;
            padding: 8px 12px;
            border-radius: 2rem;
            font-family: monospace;
            flex: 1;
        }
        button {
            background: #1f2c46;
            border: none;
            padding: 8px 16px;
            border-radius: 2rem;
            color: white;
            font-family: monospace;
            cursor: pointer;
            font-weight: bold;
        }
        button.primary { background: #2a4a7a; }
        button.warning { background: #5a3a2a; }
        .terminal-panel {
            background: #03060e;
            display: flex;
            flex-direction: column;
        }
        .terminal-header {
            background: #11161f;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            border-bottom: 1px solid #2a3348;
            display: flex;
            justify-content: space-between;
        }
        .terminal-content {
            padding: 1rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: #8bc4ff;
            height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .log-line {
            border-left: 2px solid #2a6a8a;
            padding-left: 8px;
            margin: 4px 0;
        }
        .export-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .pool-status {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
        }
        @media (max-width: 780px) { .main-grid { grid-template-columns: 1fr; } .vault-panel { border-right: none; } }
    </style>
</head>
<body>
<div class="vault-container">
    <div class="header">
        <div class="title"><span>💰 TREASURE CHEST WALLET 💰</span><span class="status-led" id="statusLed"></span></div>
        <div>🔢 7 13 22 34 41 50</div>
    </div>
    <div class="main-grid">
        <div class="vault-panel">
            <div class="chest-area">
                <div class="chest-icon" id="chestIcon">📦🔒</div>
                <div class="vault-count" id="vaultCount">0</div>
                <div>PROTECTED SHARES</div>
                <div class="btc-balance" id="btcBalance">0 BTC</div>
                <div style="font-size:0.65rem;">real Bitcoin in chest</div>
            </div>
            <div class="password-area">
                <div id="authStatus" style="color:#ffaa66; margin-bottom: 8px;">⚡ VAULT LOCKED</div>
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="Enter password">
                    <button id="unlockBtn">🔓 UNLOCK</button>
                </div>
                <div class="input-group">
                    <input type="password" id="newPasswordInput" placeholder="New password">
                    <button id="changePwBtn" class="primary">🔄 CHANGE</button>
                </div>
                <div class="export-buttons">
                    <button id="exportTxtBtn">📄 EXPORT</button>
                    <button id="exportWhatsAppBtn">📲 WHATSAPP</button>
                </div>
                <div class="pool-status" id="poolStatus">⛏️ Pool: ready (auto-submit on)</div>
            </div>
        </div>
        <div class="terminal-panel">
            <div class="terminal-header"><span>⚡ IGIGI TERMINAL</span><span id="miningState">🔴 locked</span></div>
            <div class="terminal-content" id="terminalLog">
                <div class="log-line">> TREASURE CHEST VAULT READY</div>
                <div class="log-line">> Enter password to unlock wallet</div>
            </div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // ENIGMA CORE
    const SACRED = [7, 13, 22, 34, 41, 50];
    const GOLDEN = 0x9E3779B9;
    function enigmaHash(input) {
        let hash = GOLDEN >>> 0;
        for (let i = 0; i < input.length; i++) {
            let c = input.charCodeAt(i);
            let k = SACRED[i % SACRED.length];
            hash = ((hash << 4) ^ (hash >>> 28) ^ c ^ k) >>> 0;
            hash = (hash * 33) ^ (hash + k);
            hash = hash >>> 0;
        }
        return hash.toString(16).padStart(8, '0').toUpperCase();
    }

    // --------------------------------------------------------------
    // VAULT DATA
    let vaultShares = 0;
    let unlocked = false;
    let miningInterval = null;
    let lastBalance = 0;
    const BTC_ADDR = "bc1qk7ajtrgplvn25600wm7gx9u5c5nk8kz9dfpcqy";

    function loadVaultData() {
        let shares = localStorage.getItem('igigi_vault_shares');
        vaultShares = shares ? parseInt(shares) : 0;
        document.getElementById('vaultCount').innerText = vaultShares;
    }
    function saveVaultShares() {
        localStorage.setItem('igigi_vault_shares', vaultShares);
        document.getElementById('vaultCount').innerText = vaultShares;
    }
    
    // Password management
    function setPassword(newPassword) {
        if(!newPassword) return false;
        let pwHash = enigmaHash(newPassword);
        localStorage.setItem('igigi_pw_hash', pwHash);
        addTerminalLog(`🔑 Password set (Enigma hash stored)`);
        return true;
    }
    function checkPassword(enteredPw) {
        let storedHash = localStorage.getItem('igigi_pw_hash');
        if(!storedHash) return false;
        return (enigmaHash(enteredPw) === storedHash);
    }
    
    // Terminal
    function addTerminalLog(msg) {
        let term = document.getElementById('terminalLog');
        let line = document.createElement('div');
        line.className = 'log-line';
        line.innerText = `> ${new Date().toLocaleTimeString()} · ${msg}`;
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
    }
    
    // MINING: generates Enigma hashes and INCREASES SHARES (local vault)
    function startMining() {
        if(miningInterval) clearInterval(miningInterval);
        miningInterval = setInterval(() => {
            if(unlocked) {
                let nonce = Math.random() * 1e9;
                let input = `${Date.now()}:${nonce}:${vaultShares}`;
                let hashVal = enigmaHash(input);
                vaultShares++;
                saveVaultShares();
                addTerminalLog(`⛏️ MINED #${vaultShares} | ${hashVal}`);
                // chest sparkle
                let chest = document.getElementById('chestIcon');
                chest.style.transform = 'scale(1.05)';
                setTimeout(() => chest.style.transform = '', 200);
            }
        }, 1800);
    }
    
    // REAL BTC BALANCE (treasure chest)
    async function updateChestBalance() {
        try {
            let response = await fetch(`https://blockchain.info/q/addressbalance/${BTC_ADDR}`);
            let satoshis = parseInt(await response.text());
            let btc = satoshis / 100000000;
            let chestIcon = document.getElementById('chestIcon');
            let balanceDisplay = document.getElementById('btcBalance');
            
            if (satoshis > 0) {
                chestIcon.innerHTML = '💰📦💰';
                balanceDisplay.innerHTML = `${btc.toFixed(8)} BTC`;
                if (lastBalance !== 0 && satoshis > lastBalance) {
                    chestIcon.style.transform = 'scale(1.3)';
                    setTimeout(() => chestIcon.style.transform = '', 500);
                    addTerminalLog(`💎 NEW BITCOIN DEPOSIT! +${(satoshis - lastBalance)} Satoshis`);
                }
                lastBalance = satoshis;
            } else {
                chestIcon.innerHTML = unlocked ? '📦💎' : '📦🔒';
                balanceDisplay.innerHTML = '0 BTC';
            }
        } catch(e) { console.log("balance error"); }
    }
    
    // Unlock vault
    function unlockVault(pw) {
        let storedHash = localStorage.getItem('igigi_pw_hash');
        if(!storedHash) {
            setPassword(pw);
            unlocked = true;
            document.getElementById('statusLed').classList.add('unlocked');
            document.getElementById('chestIcon').innerHTML = '📦💎';
            document.getElementById('authStatus').innerHTML = '✅ VAULT UNLOCKED · mining';
            document.getElementById('miningState').innerHTML = '🟢 mining';
            addTerminalLog(`🔓 FIRST LOGIN · VAULT UNLOCKED · mining started`);
            startMining();
            return true;
        } else if(checkPassword(pw)) {
            unlocked = true;
            document.getElementById('statusLed').classList.add('unlocked');
            document.getElementById('chestIcon').innerHTML = '📦💎';
            document.getElementById('authStatus').innerHTML = '✅ VAULT UNLOCKED';
            document.getElementById('miningState').innerHTML = '🟢 mining';
            addTerminalLog(`🔓 VAULT UNLOCKED · mining active`);
            startMining();
            return true;
        } else {
            addTerminalLog(`❌ WRONG PASSWORD`);
            return false;
        }
    }
    
    function changePassword(oldPw, newPw) {
        if(!unlocked) { addTerminalLog(`❌ VAULT LOCKED`); return false; }
        if(checkPassword(oldPw)) {
            setPassword(newPw);
            addTerminalLog(`🔁 PASSWORD CHANGED`);
            return true;
        } else { addTerminalLog(`❌ OLD PASSWORD wrong`); return false; }
    }
    
    // Export
    function exportProof() {
        return `IGIGI VAULT PROOF\nTotal Shares: ${vaultShares}\nSacred: 7,13,22,34,41,50\nBTC Address: ${BTC_ADDR}\nDate: ${new Date().toISOString()}\nLast Hash: ${enigmaHash(Date.now()+":export")}`;
    }
    function downloadTxt() {
        let blob = new Blob([exportProof()], {type: 'text/plain'});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `igigi_chest_${Date.now()}.txt`;
        a.click();
        addTerminalLog(`📁 VAULT EXPORTED`);
    }
    function shareWhatsApp() {
        window.open(`https://wa.me/?text=${encodeURIComponent(exportProof())}`, '_blank');
        addTerminalLog(`📲 WhatsApp share opened`);
    }
    
    // INIT
    window.onload = () => {
        loadVaultData();
        if(!localStorage.getItem('igigi_pw_hash')) {
            addTerminalLog(`⚡ FIRST LOGIN: create a password to unlock treasure chest`);
        } else {
            addTerminalLog(`🔐 VAULT LOCKED · enter password`);
        }
        updateChestBalance();
        setInterval(updateChestBalance, 45000);
    };
    
    // Event listeners
    document.getElementById('unlockBtn').onclick = () => {
        let pw = document.getElementById('passwordInput').value;
        if(pw) unlockVault(pw);
        else addTerminalLog(`⛔ Enter password`);
    };
    document.getElementById('changePwBtn').onclick = () => {
        let oldPw = document.getElementById('passwordInput').value;
        let newPw = document.getElementById('newPasswordInput').value;
        if(oldPw && newPw) changePassword(oldPw, newPw);
        else addTerminalLog(`⛔ Fill old + new password`);
    };
    document.getElementById('exportTxtBtn').onclick = downloadTxt;
    document.getElementById('exportWhatsAppBtn').onclick = shareWhatsApp;
</script>
</body>
</html>
