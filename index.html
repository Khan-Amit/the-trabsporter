<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igigi Vault · Wave Watcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            font-family: 'Courier New', monospace;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #0f1322;
            border-radius: 2rem;
            border: 1px solid #ffaa33;
            overflow: hidden;
        }
        .header {
            background: #080c18;
            padding: 1rem;
            border-bottom: 1px solid #ffaa33;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 450px;
        }
        .chest-panel {
            background: #0c1020;
            padding: 1.5rem;
            border-right: 1px solid #2a3a60;
        }
        .chest {
            text-align: center;
            background: #080c1a;
            border-radius: 1.5rem;
            padding: 1rem;
            border: 2px solid #ffaa33;
            margin-bottom: 1.5rem;
        }
        .chest-icon { font-size: 4rem; }
        .share-number { font-size: 2rem; color: #ffcc66; }
        .btc-number { font-size: 1.2rem; color: #88ff88; }
        .input-group {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        input {
            background: #010410;
            border: 1px solid #2a3a60;
            color: white;
            padding: 8px 12px;
            border-radius: 2rem;
            flex: 1;
        }
        button {
            background: #1f2c46;
            border: none;
            padding: 8px 16px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
        }
        button.primary { background: #2a4a7a; }
        .terminal-panel {
            background: #03060e;
            display: flex;
            flex-direction: column;
        }
        .terminal-header {
            background: #11161f;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #2a3348;
        }
        .terminal-log {
            padding: 1rem;
            font-size: 0.7rem;
            color: #8bc4ff;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
        }
        .log-line {
            border-left: 2px solid #2a6a8a;
            padding-left: 8px;
            margin: 4px 0;
        }
        .msg { color: #ffaa66; font-size: 0.7rem; text-align: center; margin-top: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="title">💰 IGIGI VAULT · WAVE WATCHER</span>
        <span>🔢 7 13 22 34 41 50</span>
    </div>
    <div class="grid">
        <div class="chest-panel">
            <div class="chest">
                <div class="chest-icon" id="chestIcon">📦🔒</div>
                <div class="share-number" id="shareCount">0</div>
                <div>ENIGMA SHARES</div>
                <div class="btc-number" id="btcDisplay">0 BTC</div>
            </div>
            <div class="input-group">
                <input type="password" id="pwInput" placeholder="Enter password">
                <button id="unlockBtn" class="primary">🔓 UNLOCK</button>
            </div>
            <div class="input-group">
                <input type="password" id="newPwInput" placeholder="New password (min 4)">
                <button id="setPwBtn">🔑 SET/CHANGE</button>
            </div>
            <button id="exportBtn">📄 EXPORT PROOF</button>
            <div id="statusMsg" class="msg"></div>
        </div>
        <div class="terminal-panel">
            <div class="terminal-header">⚡ TERMINAL <span id="minerState">🔴 LOCKED</span></div>
            <div class="terminal-log" id="terminalLog">
                <div class="log-line">> VAULT READY</div>
                <div class="log-line">> Enter password to unlock</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ENIGMA CORE
    const SACRED = [7, 13, 22, 34, 41, 50];
    const GOLDEN = 0x9E3779B9;
    function enigmaHash(str) {
        let h = GOLDEN >>> 0;
        for (let i = 0; i < str.length; i++) {
            let c = str.charCodeAt(i);
            let k = SACRED[i % SACRED.length];
            h = ((h << 4) ^ (h >>> 28) ^ c ^ k) >>> 0;
            h = (h * 33) ^ (h + k);
            h = h >>> 0;
        }
        return h.toString(16).padStart(8, '0').toUpperCase();
    }

    // STORAGE KEYS
    const KEY_PW = 'igigi_wave_pw';
    const KEY_SHARES = 'igigi_wave_shares';

    let unlocked = false;
    let shares = 0;
    let miningInterval = null;
    let lastHash = '';
    const BTC_ADDR = "bc1qk7ajtrgplvn25600wm7gx9u5c5nk8kz9dfpcqy";

    // Helper functions
    function log(msg) {
        const term = document.getElementById('terminalLog');
        const div = document.createElement('div');
        div.className = 'log-line';
        div.innerText = `> ${new Date().toLocaleTimeString()} · ${msg}`;
        term.appendChild(div);
        term.scrollTop = term.scrollHeight;
        if (term.children.length > 200) term.removeChild(term.children[0]);
    }

    function showMsg(msg, isError = false) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.style.color = isError ? '#ff8866' : '#88ff88';
        setTimeout(() => el.innerText = '', 3000);
    }

    function saveShares() {
        localStorage.setItem(KEY_SHARES, shares);
        document.getElementById('shareCount').innerText = shares;
    }

    function loadShares() {
        const s = localStorage.getItem(KEY_SHARES);
        shares = s ? parseInt(s) : 0;
        document.getElementById('shareCount').innerText = shares;
    }

    // Password
    function getStoredHash() {
        return localStorage.getItem(KEY_PW);
    }

    function setPassword(pw) {
        if (!pw || pw.length < 4) return false;
        const hash = enigmaHash(pw);
        localStorage.setItem(KEY_PW, hash);
        return true;
    }

    function verifyPassword(pw) {
        const stored = getStoredHash();
        if (!stored) return false;
        return enigmaHash(pw) === stored;
    }

    // Mining (Enigma hashes, local only)
    function startLocalMining() {
        if (miningInterval) clearInterval(miningInterval);
        miningInterval = setInterval(() => {
            if (unlocked) {
                const input = Date.now() + ':' + Math.random() + ':' + shares;
                const hash = enigmaHash(input);
                shares++;
                saveShares();
                lastHash = hash;
                log(`⛏️ MINED #${shares} | ${hash}`);
                const chest = document.getElementById('chestIcon');
                chest.style.transform = 'scale(1.1)';
                setTimeout(() => chest.style.transform = '', 200);
            }
        }, 1800);
    }

    // Unlock
    function unlockVault(pw) {
        const stored = getStoredHash();
        if (!stored) {
            // First time: create password
            if (pw.length < 4) {
                showMsg("Password must be at least 4 characters", true);
                return false;
            }
            setPassword(pw);
            unlocked = true;
            document.getElementById('chestIcon').innerHTML = '📦💎✨';
            document.getElementById('minerState').innerHTML = '🟢 MINING';
            log(`🔓 VAULT CREATED AND UNLOCKED`);
            startLocalMining();
            showMsg("Vault created! Mining started.");
            return true;
        } else if (verifyPassword(pw)) {
            unlocked = true;
            document.getElementById('chestIcon').innerHTML = '📦💎✨';
            document.getElementById('minerState').innerHTML = '🟢 MINING';
            log(`🔓 VAULT UNLOCKED`);
            startLocalMining();
            showMsg("Vault unlocked.");
            return true;
        } else {
            showMsg("Wrong password", true);
            log(`⚠️ FAILED UNLOCK ATTEMPT`);
            return false;
        }
    }

    function changePassword(oldPw, newPw) {
        if (!unlocked) {
            showMsg("Vault must be unlocked first", true);
            return false;
        }
        if (!verifyPassword(oldPw)) {
            showMsg("Old password is wrong", true);
            return false;
        }
        if (!newPw || newPw.length < 4) {
            showMsg("New password min 4 characters", true);
            return false;
        }
        setPassword(newPw);
        log(`🔁 PASSWORD CHANGED`);
        showMsg("Password changed successfully");
        return true;
    }

    // Real BTC balance
    async function fetchBTCBalance() {
        try {
            const res = await fetch(`https://blockchain.info/q/addressbalance/${BTC_ADDR}`);
            const sat = parseInt(await res.text());
            const btc = sat / 100000000;
            document.getElementById('btcDisplay').innerHTML = btc.toFixed(8) + ' BTC';
            if (sat > 0 && document.getElementById('chestIcon').innerHTML !== '💰📦💰') {
                document.getElementById('chestIcon').innerHTML = '💰📦💰';
                log(`💎 REAL BITCOIN DETECTED: ${btc.toFixed(8)} BTC`);
            }
        } catch(e) {
            console.log("Balance fetch failed");
        }
    }

    // Export
    function exportProof() {
        const content = `IGIGI WAVE VAULT PROOF\nDate: ${new Date().toISOString()}\nTotal Enigma Shares: ${shares}\nBTC Address: ${BTC_ADDR}\nSacred Numbers: 7,13,22,34,41,50\nGolden Ratio: 0x9E3779B9\nLast Hash: ${lastHash || '—'}`;
        const blob = new Blob([content], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `igigi_vault_${Date.now()}.txt`;
        a.click();
        log(`📁 VAULT EXPORTED to Downloads`);
        showMsg("Proof exported");
    }

    // UI Events
    document.getElementById('unlockBtn').onclick = () => {
        const pw = document.getElementById('pwInput').value;
        if (pw) unlockVault(pw);
        else showMsg("Enter a password", true);
    };
    document.getElementById('setPwBtn').onclick = () => {
        const oldPw = document.getElementById('pwInput').value;
        const newPw = document.getElementById('newPwInput').value;
        if (oldPw && newPw) changePassword(oldPw, newPw);
        else showMsg("Fill both old and new password fields", true);
    };
    document.getElementById('exportBtn').onclick = exportProof;

    // Initialize
    loadShares();
    fetchBTCBalance();
    setInterval(fetchBTCBalance, 45000);
    
    if (getStoredHash()) {
        log(`🔐 VAULT LOCKED · enter password to unlock`);
    } else {
        log(`⚡ FIRST RUN · create a password to begin`);
    }
</script>
</body>
</html>
