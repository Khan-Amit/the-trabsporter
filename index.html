<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>IGIGI VAULT · TRANSPORTER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f1e;
            font-family: 'Courier New', monospace;
            color: #9cdbff;
            padding: 20px;
        }
        .vault {
            max-width: 700px;
            margin: 0 auto;
            background: #0f172a;
            border-radius: 24px;
            border: 1px solid #1e293b;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .header {
            background: #020617;
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            color: #00f2fe;
            font-size: 1.4rem;
        }
        .balance {
            background: #010409;
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #2d3748;
        }
        .balance .amount {
            font-size: 2rem;
            font-weight: bold;
            color: #00f2fe;
        }
        .terminal {
            background: #010409;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid #2d3748;
        }
        .terminal p {
            margin: 4px 0;
            white-space: pre-wrap;
        }
        .lock-area {
            padding: 16px;
            text-align: center;
        }
        input {
            background: #1e293b;
            border: 1px solid #2d3748;
            color: #9cdbff;
            padding: 10px;
            font-family: monospace;
            border-radius: 8px;
            width: 200px;
            text-align: center;
        }
        button {
            background: #2e7d64;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: monospace;
            margin-left: 10px;
        }
        .status {
            margin-top: 10px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .footer {
            padding: 12px;
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>
<div class="vault">
    <div class="header">
        <h1>⚡ IGIGI VAULT · TRANSPORTER</h1>
    </div>
    <div class="balance">
        <div class="amount" id="btcBalance">0.00000000</div>
        <div>BTC · ENIGMA SHARES</div>
    </div>
    <div class="terminal" id="terminal">
        <p>> VAULT READY</p>
        <p>> Enter password to unlock</p>
    </div>
    <div class="lock-area">
        <input type="password" id="vaultPassword" placeholder="password">
        <button id="unlockBtn">UNLOCK</button>
        <div id="statusMsg" class="status"></div>
    </div>
    <div class="footer">MONERO ACCEPTED · WAVE WATCHER</div>
</div>

<script>
    // This is Part 2 – we will add the logic separately
</script>
</body>
</html>
